name: Compila APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - run: gradle :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk radar-occhiali.apk
      - uses: actions/upload-artifact@v4
        with:
          name: radar-occhiali-apk
          path: radar-occhiali.apk
      # pubblica l'APK nella pagina Releases ("ultima"), scaricabile direttamente dal telefono
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima radar-occhiali.apk --title "Radar Occhiali (ultima versione)" \
            --notes "Scarica radar-occhiali.apk dal telefono e installalo. Compilato da ${GITHUB_SHA::7}." --latest

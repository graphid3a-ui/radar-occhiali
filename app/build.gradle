plugins { id "com.android.application" }

android {
    namespace "it.paolo.radarocchiali"
    compileSdk 36
    defaultConfig {
        applicationId "it.paolo.radarocchiali"
        minSdk 26
        targetSdk 36      // requisito Google Play da agosto 2026
        versionCode 2
        versionName "1.2"
    }
    buildTypes {
        // APK installabile subito: firmato con la chiave di debug
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false; checkReleaseBuilds false }
}

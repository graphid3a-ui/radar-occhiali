plugins { id "com.android.application" }

android {
    namespace "it.paolo.radarocchiali"
    compileSdk 36
    defaultConfig {
        applicationId "it.paolo.radarocchiali"
        minSdk 26
        targetSdk 36      // requisito Google Play da agosto 2026
        versionCode 2
        versionName "1.2"
    }
    // Chiave di firma fissa (segreti GitHub KEYSTORE_B64 / KEYSTORE_PASS): permette di
    // aggiornare l'app senza disinstallarla. Senza segreti si usa la chiave di debug.
    def ks = System.getenv("KS_PATH")
    signingConfigs {
        stabile {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("KS_PASS")
                keyAlias "radar"
                keyPassword System.getenv("KS_PASS")
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.stabile
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
